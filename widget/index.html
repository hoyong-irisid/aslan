<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASLAN — IRIS ID Chat (local)</title>
  <style>
    :root {
      --iris-navy: #0f172a;
      --iris-accent: #0ea5e9;
      --iris-muted: #64748b;
      --surface: #ffffff;
      --bubble-user: #e0f2fe;
      --bubble-bot: #f1f5f9;
      --shadow: 0 12px 40px rgba(15, 23, 42, 0.18);
      --radius: 14px;
      --fab-size: 58px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #e2e8f0 0%, #f8fafc 45%, #e0f2fe 100%);
      color: var(--iris-navy);
    }
    body.aslan-chat-open .demo-page {
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .demo-page {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .demo-page h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    .demo-page p { color: var(--iris-muted); line-height: 1.6; margin: 0; }

    /* Launcher */
    .aslan-fab {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: var(--fab-size);
      height: var(--fab-size);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(145deg, #67000c, var(--iris-accent));
      color: #fff;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 0;
      overflow: visible;
      z-index: 9998;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .aslan-fab:hover { transform: scale(1.05); }
    .aslan-fab-logo {
      display: block;
      height: 280px;
      width: auto;
      max-width: 280px;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      flex: 0 0 auto;
      transform-origin: center center;
      transition: transform 0.45s ease;
    }
    .aslan-fab:hover .aslan-fab-logo { transform: rotate(90deg); }

    /* Panel */
    .aslan-panel {
      position: fixed;
      right: 22px;
      bottom: calc(22px + var(--fab-size) + 14px);
      width: min(400px, calc(100vw - 32px));
      height: min(520px, calc(100vh - 120px));
      max-height: calc(100vh - 120px);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: translateY(12px) scale(0.98);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
    }
    .aslan-panel.open {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .aslan-header {
      padding: 14px 16px;
      background: var(--iris-navy);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .aslan-header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .aslan-header-symbol {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: block;
      border-radius: 50%;
      object-fit: cover;
    }
    .aslan-header strong { font-size: 0.95rem; }
    .aslan-header span { font-size: 0.72rem; opacity: 0.85; }
    .aslan-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .aslan-partner-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      background: #fff;
      color: var(--iris-navy);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      white-space: nowrap;
    }
    .aslan-partner-badge .picon-dot {
      width: 12px;
      height: 14px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #111827;
    }
    .aslan-partner-badge .picon-dot svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .aslan-partner-badge .picon-check {
      width: 12px;
      height: 14px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #16a34a;
    }
    .aslan-partner-badge .picon-check svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .aslan-partner-badge.verified {
      color: #15803d;
      cursor: default;
    }
    .aslan-close {
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.35rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .aslan-close:hover { background: rgba(255,255,255,0.12); }

    .aslan-messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
    }
    .msg {
      max-width: 92%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .msg a {
      color: #2563eb;
      text-decoration: none;
      overflow-wrap: anywhere;
      word-break: break-all;
    }
    .msg a:hover { color: #1d4ed8; }
    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: var(--iris-navy);
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      color: var(--iris-navy);
    }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .msg .msg-image {
      margin-top: 8px;
      display: block;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: zoom-in;
    }
    .msg .figure-options {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .msg .figure-option-btn {
      font-size: 0.72rem;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--iris-navy);
      cursor: pointer;
    }
    .msg .figure-option-btn:hover { border-color: var(--iris-accent); color: #780012; }
    .msg .choice-options {
      margin-top: 10px;
      border: 1px solid #dbe3ef;
      background: #ffffff;
      border-radius: 10px;
      padding: 8px;
      display: grid;
      gap: 6px;
    }
    .msg .choice-option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--iris-navy);
    }
    .msg .choice-option-row input[type="radio"] {
      margin: 0;
      accent-color: #0f172a;
    }
    .msg .choice-option-actions {
      margin-top: 2px;
      display: flex;
      justify-content: flex-end;
    }
    .msg .choice-option-send {
      font-size: 0.74rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--iris-navy);
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .msg .choice-option-send:hover { border-color: var(--iris-accent); color: #0369a1; }
    .msg.typing {
      align-self: flex-start;
      background: var(--bubble-bot);
      color: var(--iris-muted);
      min-width: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 12px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      opacity: 0.35;
      animation: aslan-dot-pulse 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes aslan-dot-pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-2px); opacity: 0.95; }
    }

    .aslan-footer {
      padding: 12px 14px 14px;
      background: var(--surface);
      border-top: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .chip {
      font-size: 0.72rem;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--iris-navy);
      cursor: pointer;
    }
    .chip:hover { border-color: var(--iris-accent); color: #780012; }
    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .aslan-input {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      font: inherit;
    }
    .aslan-input:focus {
      outline: 2px solid var(--iris-accent);
      outline-offset: 0;
      border-color: transparent;
    }
    .aslan-mic {
      height: 44px;
      width: 44px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: var(--iris-navy);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .aslan-mic:hover { border-color: var(--iris-accent); color: #0369a1; }
    .aslan-mic svg { width: 22px; height: 22px; display: block; }
    .aslan-mic.listening {
      background: #fef2f2;
      border-color: #f87171;
      color: #b91c1c;
      animation: aslan-mic-pulse 1.1s ease-in-out infinite;
    }
    .aslan-mic:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes aslan-mic-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }
    .aslan-send {
      height: 44px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: var(--iris-navy);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .aslan-send:disabled { opacity: 0.55; cursor: not-allowed; }
    .aslan-hint {
      font-size: 0.58rem;
      color: var(--iris-muted);
      margin-top: 8px;
    }
    .aslan-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10010;
      padding: 20px;
    }
    .aslan-modal-backdrop.open { display: flex; }
    .aslan-modal {
      width: min(420px, calc(100vw - 40px));
      background: #fff;
      border-radius: 14px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
      padding: 16px;
    }
    .aslan-modal-title {
      margin: 0;
      font-size: 1rem;
      color: var(--iris-navy);
    }
    .aslan-modal-desc {
      margin: 8px 0 12px;
      color: var(--iris-muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }
    .aslan-modal-input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    .aslan-modal-input:focus {
      outline: 2px solid var(--iris-accent);
      border-color: transparent;
    }
    .aslan-modal-error {
      display: none;
      margin-top: 8px;
      color: #b91c1c;
      font-size: 0.8rem;
    }
    .aslan-modal-error.show { display: block; }
    .aslan-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .aslan-btn {
      border-radius: 10px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--iris-navy);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
    }
    .aslan-btn:hover { border-color: var(--iris-accent); color: #0369a1; }
    .aslan-btn-primary {
      border: none;
      background: var(--iris-navy);
      color: #fff;
    }
    .aslan-btn-primary:hover {
      color: #fff;
      background: #1e293b;
    }
    .aslan-toast {
      position: fixed;
      right: 22px;
      bottom: calc(22px + var(--fab-size) + 24px);
      z-index: 10020;
      background: #0b1222;
      color: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .aslan-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .aslan-toast.error { background: #7f1d1d; }
    .aslan-image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 10030;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .aslan-image-lightbox.open { display: flex; }
    .aslan-image-lightbox img {
      max-width: min(1100px, 96vw);
      max-height: 90vh;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(2, 6, 23, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #fff;
      object-fit: contain;
    }
    .aslan-image-lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
    }
    .aslan-image-lightbox-close:hover { background: rgba(15, 23, 42, 0.9); }
  </style>
</head>
<body>
  <div class="demo-page">
    <p>
      <img src="symbol-irisid-dark-color.png" width="72" height="72" alt="" style="display:block" />
    </p>
    <h1 style="margin-top:20px">Iris ID AI Chatbot</h1>
    <p style="margin-top:10px">
      ASLAN local demo — use the chat button (bottom-right).
    </p>
  </div>

  <button type="button" class="aslan-fab" id="aslanFab" aria-label="Open chat">
    <img class="aslan-fab-logo" src="symbol-irisid-white.svg" width="160" height="auto"
    />
  </button>

  <div class="aslan-panel" id="aslanPanel" role="dialog" aria-label="Chat">
    <div class="aslan-header">
      <div class="aslan-header-brand">
        <img
          src="symbol-irisid-light-color.png" width="35" height="auto"
        />
        <div>
          <strong>Iris ID Assistant</strong><br />
          <span>Local · ASLAN</span>
        </div>
      </div>
      <div class="aslan-header-actions">
        <button type="button" class="aslan-partner-badge" id="aslanPartnerBadge" aria-label="Partner login">
          <span class="picon-dot" aria-hidden="true"></span><span>Partner</span>
        </button>
        <button type="button" class="aslan-close" id="aslanClose" aria-label="Close chat">×</button>
      </div>
    </div>
    <div class="aslan-messages" id="aslanMessages"></div>
    <div class="aslan-footer">
      <div class="chips" id="aslanChips"></div>
      <div class="row">
        <textarea class="aslan-input" id="aslanInput" rows="1" placeholder="Message…"></textarea>
        <button type="button" class="aslan-mic" id="aslanMic" aria-label="Voice input" aria-pressed="false" title="Voice input (browser)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button type="button" class="aslan-send" id="aslanSend">Send</button>
      </div>
      <div class="aslan-hint">Powered by your local <code>/chat</code> API. Voice uses your browser (HTTPS or localhost). Email transcript needs Resend or SMTP in <code>.env</code>.</div>
    </div>
  </div>
  <div class="aslan-toast" id="aslanToast"></div>
  <div class="aslan-image-lightbox" id="aslanImageLightbox" aria-hidden="true">
    <button type="button" class="aslan-image-lightbox-close" id="aslanImageLightboxClose" aria-label="Close image preview">×</button>
    <img id="aslanImageLightboxImg" alt="Expanded chat image" />
  </div>

  <script>
    (function () {
      var API_BASE = ""; // same origin when served from FastAPI /widget/
      var PARTNER_TOKEN_KEY = "aslan.partner_token";
      var TRANSCRIPT_RECIPIENT = "hoyong.lee@irisid.com";
      var chatHistory = [];

      function getPartnerToken() {
        try { return window.sessionStorage.getItem(PARTNER_TOKEN_KEY) || null; }
        catch (e) { return null; }
      }
      function setPartnerToken(tok) {
        try {
          if (tok) window.sessionStorage.setItem(PARTNER_TOKEN_KEY, tok);
          else window.sessionStorage.removeItem(PARTNER_TOKEN_KEY);
        } catch (e) {}
      }

      var fab = document.getElementById("aslanFab");
      var panel = document.getElementById("aslanPanel");
      var closeBtn = document.getElementById("aslanClose");
      var partnerBadge = document.getElementById("aslanPartnerBadge");
      var messagesEl = document.getElementById("aslanMessages");
      var input = document.getElementById("aslanInput");
      var sendBtn = document.getElementById("aslanSend");
      var micBtn = document.getElementById("aslanMic");
      var chipsEl = document.getElementById("aslanChips");
      var toastEl = document.getElementById("aslanToast");
      var imageLightbox = document.getElementById("aslanImageLightbox");
      var imageLightboxImg = document.getElementById("aslanImageLightboxImg");
      var imageLightboxClose = document.getElementById("aslanImageLightboxClose");
      var typingEl = null;
      var toastTimer = null;
      var closingPanel = false;

      var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      var voiceRec = null;
      var voiceBaseText = "";

      var WELCOME_TEXT =
        "Hi, I’m the Iris ID assistant. Ask anything, or tap a suggestion below.";

      var suggestions = [
        "How can I contact support?",
        "Request a demo",
        "Product documentation",
        "Office location",
      ];

      function _extractImageUrls(text) {
        var out = [];
        var lines = String(text || "").split(/\n/);
        lines.forEach(function (ln) {
          var m = ln.match(/^\s*IMAGE_URL:\s*(\S+)\s*$/i);
          if (m && m[1]) out.push(m[1]);
        });
        return out;
      }

      function _extractFigureOptions(text) {
        var out = [];
        var lines = String(text || "").split(/\n/);
        lines.forEach(function (ln) {
          var m = ln.match(/^\s*FIGURE_OPTION:\s*([a-z0-9\-_.]+)\|(.*)$/i);
          if (!m) return;
          var id = (m[1] || "").trim();
          var title = (m[2] || "").trim() || id;
          if (id) out.push({ id: id, title: title });
        });
        return out;
      }

      function _extractChoiceOptions(text) {
        var src = String(text || "");
        var lines = src.split(/\n/);
        var opts = [];
        var kept = [];
        lines.forEach(function (ln) {
          var m = ln.match(/^\s*(?:[-*•]|\d+[.)])\s*["']?([^"'\n]+?)["']?\s*$/);
          if (m && m[1]) {
            var option = m[1].trim();
            if (option.length >= 3) {
              opts.push(option);
              return;
            }
          }
          kept.push(ln);
        });
        // De-dupe and keep only reasonable, explicit options.
        var uniq = [];
        var seen = {};
        opts.forEach(function (o) {
          var k = o.toLowerCase();
          if (seen[k]) return;
          seen[k] = true;
          uniq.push(o);
        });
        if (uniq.length < 2 || uniq.length > 8) {
          return { options: [], stripped: src };
        }
        return { options: uniq, stripped: kept.join("\n").trim() || src };
      }

      function syncPartnerBadge() {
        if (!partnerBadge) return;
        var verified = !!getPartnerToken();
        partnerBadge.classList.toggle("verified", verified);
        if (verified) {
          partnerBadge.innerHTML =
            '<span class="picon-check" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd"/></svg></span><span>Verified</span>';
          partnerBadge.setAttribute("aria-label", "Verified partner");
        } else {
          partnerBadge.innerHTML =
            '<span class="picon-dot" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 1a4.5 4.5 0 0 0-4.5 4.5V9H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-.5V5.5A4.5 4.5 0 0 0 10 1Zm3 8V5.5a3 3 0 1 0-6 0V9h6Z" clip-rule="evenodd"/></svg></span><span>Partner</span>';
          partnerBadge.setAttribute("aria-label", "Partner login");
        }
      }

      function appendMessage(role, text, isError) {
        var raw = String(text || "");
        if (role === "user") {
          chatHistory.push({ role: "user", text: raw });
        } else {
          chatHistory.push({ role: "assistant", text: raw });
        }
        var div = document.createElement("div");
        div.className = "msg " + (isError ? "error" : role === "user" ? "user" : "bot");
        var imageUrls = _extractImageUrls(raw);
        var figureOptions = _extractFigureOptions(raw);
        var genericChoice = _extractChoiceOptions(raw);
        var clean = raw
          .replace(/^\s*IMAGE_URL:\s*\S+\s*$/gim, "")
          .replace(/^\s*FIGURE_OPTION:\s*([a-z0-9\-_.]+)\|(.*)$/gim, "")
          .trim();
        var displayBase = genericChoice.options.length > 0 ? genericChoice.stripped : (clean || raw);
        var displayText = displayBase.replace(/^(\s*)\*\s+/gm, "$1• ");
        renderInlineBold(div, displayText);
        imageUrls.forEach(function (u) {
          var img = document.createElement("img");
          img.className = "msg-image";
          img.src = u;
          img.alt = "Partner figure";
          img.loading = "lazy";
          img.addEventListener("click", function () {
            openImageLightbox(u, img.alt || "Expanded chat image");
          });
          div.appendChild(img);
        });
        if (figureOptions.length > 0) {
          var wrap = document.createElement("div");
          wrap.className = "figure-options";
          figureOptions.forEach(function (opt) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "figure-option-btn";
            b.textContent = opt.title;
            b.addEventListener("click", function () {
              var tok = getPartnerToken();
              if (!tok) {
                appendMessage("bot", "Partner session expired. Please verify partner code again.", true);
                return;
              }
              appendMessage("user", "Show image: " + opt.title);
              appendMessage(
                "bot",
                "Figure: " + opt.title + "\nIMAGE_URL: " + "/partner/asset/" + encodeURIComponent(opt.id) + "?token=" + encodeURIComponent(tok)
              );
            });
            wrap.appendChild(b);
          });
          div.appendChild(wrap);
        } else if (genericChoice.options.length > 0) {
          var choiceWrap = document.createElement("div");
          choiceWrap.className = "choice-options";
          var radioName = "aslan-choice-" + Date.now() + "-" + Math.floor(Math.random() * 10000);
          genericChoice.options.forEach(function (opt, idx) {
            var row = document.createElement("label");
            row.className = "choice-option-row";
            var r = document.createElement("input");
            r.type = "radio";
            r.name = radioName;
            r.value = opt;
            if (idx === 0) r.checked = true;
            var s = document.createElement("span");
            renderInlineBold(s, opt);
            row.appendChild(r);
            row.appendChild(s);
            choiceWrap.appendChild(row);
          });
          var action = document.createElement("div");
          action.className = "choice-option-actions";
          var chooseBtn = document.createElement("button");
          chooseBtn.type = "button";
          chooseBtn.className = "choice-option-send";
          chooseBtn.textContent = "Select";
          chooseBtn.addEventListener("click", function () {
            var selected = choiceWrap.querySelector('input[name="' + radioName + '"]:checked');
            if (!selected) return;
            input.value = selected.value;
            sendMessage();
          });
          action.appendChild(chooseBtn);
          choiceWrap.appendChild(action);
          div.appendChild(choiceWrap);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function openImageLightbox(src, alt) {
        if (!imageLightbox || !imageLightboxImg) return;
        imageLightboxImg.src = String(src || "");
        imageLightboxImg.alt = String(alt || "Expanded chat image");
        imageLightbox.classList.add("open");
        imageLightbox.setAttribute("aria-hidden", "false");
      }

      function closeImageLightbox() {
        if (!imageLightbox || !imageLightboxImg) return;
        imageLightbox.classList.remove("open");
        imageLightbox.setAttribute("aria-hidden", "true");
        imageLightboxImg.removeAttribute("src");
      }

      function _appendTextWithLinks(el, text) {
        var src = String(text || "");
        var re = /(https?:\/\/[^\s<>"')\]]+)/gi;
        var last = 0;
        var m;
        while ((m = re.exec(src)) !== null) {
          if (m.index > last) {
            el.appendChild(document.createTextNode(src.slice(last, m.index)));
          }
          var a = document.createElement("a");
          a.href = m[1];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = m[1];
          el.appendChild(a);
          last = re.lastIndex;
        }
        if (last < src.length) {
          el.appendChild(document.createTextNode(src.slice(last)));
        }
      }

      function renderInlineBold(el, text) {
        var src = String(text || "");
        var re = /\*\*(.+?)\*\*/g;
        var last = 0;
        var m;
        while ((m = re.exec(src)) !== null) {
          if (m.index > last) {
            _appendTextWithLinks(el, src.slice(last, m.index));
          }
          var strong = document.createElement("strong");
          _appendTextWithLinks(strong, m[1]);
          el.appendChild(strong);
          last = re.lastIndex;
        }
        if (last < src.length) {
          _appendTextWithLinks(el, src.slice(last));
        }
      }

      function showTyping() {
        if (typingEl) return;
        typingEl = document.createElement("div");
        typingEl.className = "msg typing";
        typingEl.setAttribute("aria-label", "Assistant is typing");
        typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
        messagesEl.appendChild(typingEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function hideTyping() {
        if (!typingEl) return;
        typingEl.remove();
        typingEl = null;
      }

      function setLoading(loading) {
        if (loading) stopVoiceInput();
        sendBtn.disabled = loading;
        if (micBtn) micBtn.disabled = loading;
        if (loading) sendBtn.textContent = "…";
        else sendBtn.textContent = "Send";
      }

      function showToast(message, isError) {
        if (!toastEl) return;
        if (toastTimer) {
          window.clearTimeout(toastTimer);
          toastTimer = null;
        }
        toastEl.textContent = String(message || "");
        toastEl.classList.toggle("error", !!isError);
        toastEl.classList.add("show");
        toastTimer = window.setTimeout(function () {
          toastEl.classList.remove("show");
        }, isError ? 3600 : 2600);
      }


      function stopVoiceInput() {
        if (voiceRec) {
          try {
            voiceRec.onresult = null;
            voiceRec.onerror = null;
            voiceRec.onend = null;
            voiceRec.stop();
          } catch (e) {}
          voiceRec = null;
        }
        if (micBtn) {
          micBtn.classList.remove("listening");
          micBtn.setAttribute("aria-pressed", "false");
        }
      }

      function toggleVoiceInput() {
        if (!SpeechRec) {
          appendMessage(
            "bot",
            "Voice input is not supported in this browser. Try Chrome or Edge over HTTPS (or localhost).",
            true
          );
          return;
        }
        if (micBtn && micBtn.classList.contains("listening")) {
          stopVoiceInput();
          return;
        }
        stopVoiceInput();
        voiceBaseText = (input.value || "").trim();
        if (voiceBaseText) voiceBaseText += " ";

        voiceRec = new SpeechRec();
        voiceRec.lang = (navigator.language || "en-US").replace(/_/g, "-");
        voiceRec.interimResults = true;
        voiceRec.continuous = false;
        voiceRec.maxAlternatives = 1;

        voiceRec.onresult = function (event) {
          var piece = "";
          for (var i = 0; i < event.results.length; i++) {
            piece += event.results[i][0].transcript;
          }
          input.value = voiceBaseText + piece;
        };
        voiceRec.onerror = function (event) {
          var msg = event.error || "unknown";
          if (msg === "not-allowed") {
            appendMessage("bot", "Microphone permission denied. Allow mic for this site and try again.", true);
          } else if (msg !== "aborted" && msg !== "no-speech") {
            appendMessage("bot", "Voice input error: " + msg, true);
          }
          stopVoiceInput();
        };
        voiceRec.onend = function () {
          stopVoiceInput();
        };

        try {
          if (micBtn) {
            micBtn.classList.add("listening");
            micBtn.setAttribute("aria-pressed", "true");
          }
          voiceRec.start();
        } catch (e) {
          stopVoiceInput();
          appendMessage("bot", "Could not start voice input.", true);
        }
      }

      function renderChips() {
        chipsEl.innerHTML = "";
        suggestions.forEach(function (label) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = label;
          b.addEventListener("click", function () {
            input.value = label;
            sendMessage();
          });
          chipsEl.appendChild(b);
        });
      }

      function resetChatUI() {
        stopVoiceInput();
        hideTyping();
        messagesEl.innerHTML = "";
        chatHistory = [];
        input.value = "";
        setLoading(false);
        syncPartnerBadge();
      }

      function openPanelFresh() {
        resetChatUI();
        appendMessage("bot", WELCOME_TEXT);
        messagesEl.scrollTop = 0;
        syncPartnerBadge();
      }

      function togglePanel(open) {
        var wasOpen = panel.classList.contains("open");
        if (open && !wasOpen) {
          openPanelFresh();
        } else if (!open && wasOpen) {
          resetChatUI();
          // Partner auth is tied to this chat session only; closing ends it.
          setPartnerToken(null);
          syncPartnerBadge();
        }
        panel.classList.toggle("open", open);
        document.body.classList.toggle("aslan-chat-open", open);
      }

      async function postTranscriptEmail() {
        var tok = getPartnerToken();
        if (!tok) throw new Error("Partner session required");
        var res = await fetch(API_BASE + "/email/chat-transcript", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            partner_token: tok,
            to_email: TRANSCRIPT_RECIPIENT,
            messages: chatHistory,
          }),
        });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          throw new Error(data.detail || res.statusText || "Email failed");
        }
        return data;
      }

      async function closePanelWithOptionalEmail() {
        if (closingPanel) return;
        closingPanel = true;
        try {
          var tok = getPartnerToken();
          if (tok && chatHistory.length > 0) {
            try {
              await postTranscriptEmail();
              showToast("Transcript sent to hoyong.lee@irisid.com.");
            } catch (err) {
              showToast(err && err.message ? err.message : String(err), true);
            }
          }
        } finally {
          // Closing the chat always ends partner session for this widget session.
          setPartnerToken(null);
          syncPartnerBadge();
          togglePanel(false);
          closingPanel = false;
        }
      }

      fab.addEventListener("click", function () {
        if (closingPanel) return;
        if (panel.classList.contains("open")) {
          closePanelWithOptionalEmail();
        } else {
          togglePanel(true);
        }
      });
      closeBtn.addEventListener("click", function (e) {
        e.preventDefault();
        if (closingPanel) return;
        closePanelWithOptionalEmail();
      });
      if (partnerBadge) {
        partnerBadge.addEventListener("click", function () {
          if (getPartnerToken()) return;
          appendMessage(
            "bot",
            "Please enter your Partner access ID in the message box below."
          );
          input.focus();
        });
      }

      async function sendMessage() {
        stopVoiceInput();
        var text = (input.value || "").trim();
        if (!text) return;
        input.value = "";
        appendMessage("user", text);
        setLoading(true);
        showTyping();
        try {
          var res = await fetch(API_BASE + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              region_hint: null,
              partner_token: getPartnerToken(),
              chat_history: chatHistory.slice(0, -1),
            }),
          });
          var data = await res.json().catch(function () { return {}; });
          hideTyping();
          if (!res.ok) {
            appendMessage("bot", data.detail || res.statusText || "Request failed", true);
            return;
          }
          if (data.partner_authenticated && data.partner_token) {
            setPartnerToken(data.partner_token);
            syncPartnerBadge();
          }
          appendMessage("bot", data.reply || "(empty reply)");
        } catch (e) {
          hideTyping();
          appendMessage("bot", "Network error: " + (e && e.message ? e.message : e), true);
        } finally {
          hideTyping();
          setLoading(false);
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      if (micBtn) micBtn.addEventListener("click", toggleVoiceInput);
      // IME (Korean, Japanese, …): Enter commits composition — ignore that keydown or text duplicates / double send.
      input.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" || e.shiftKey) return;
        if (e.isComposing || e.keyCode === 229) return;
        e.preventDefault();
        sendMessage();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && imageLightbox && imageLightbox.classList.contains("open")) {
          closeImageLightbox();
          return;
        }
      });
      if (imageLightbox) {
        imageLightbox.addEventListener("click", function (e) {
          if (e.target === imageLightbox) closeImageLightbox();
        });
      }
      if (imageLightboxClose) {
        imageLightboxClose.addEventListener("click", closeImageLightbox);
      }

      // Partner auth is per-chat/session only. Never restore from previous page lifetime.
      setPartnerToken(null);
      renderChips();
      syncPartnerBadge();
    })();
  </script>
</body>
