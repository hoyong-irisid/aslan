<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="icon" type="image/png" href="/partner/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>IRIS ID — Partner Admin</title>
  <style>
    :root {
      --iris-slate: #475569;
      --iris-dark: #1e293b;
      --iris-accent: #0ea5e9;
      --iris-bg: #ffffff;
      --iris-border: #e2e8f0;
      --iris-danger: #dc2626;
      --iris-danger-hover: #b91c1c;
      --iris-muted: #64748b;
      --iris-surface: #f8fafc;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 25px rgba(15, 23, 42, 0.12);
      --radius: 8px;
      --radius-lg: 12px;
    }
    * { box-sizing: border-box; }
    body, input, select, button {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      background: var(--iris-bg);
      color: var(--iris-dark);
      font-size: 14px;
      line-height: 1.5;
    }
    .page-shell { max-width: 1200px; margin: 0 auto; padding: 1rem 1.25rem 1.25rem; }
    .portal-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--iris-border);
    }
    .portal-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }
    .portal-brand img {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .portal-brand h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .portal-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-left: auto;
    }
    .portal-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--iris-border);
      background: #fff;
      color: var(--iris-dark);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .portal-tab:hover { background: var(--iris-surface); }
    .portal-tab-icon {
      padding: 0.4rem;
      border: none;
      background: transparent;
      color: #64748b;
      min-width: 2.125rem;
      min-height: 2.125rem;
      box-sizing: border-box;
    }
    .portal-tab-icon:hover {
      background: var(--iris-surface);
      color: var(--iris-dark);
      border: none;
    }
    .portal-tab-icon svg {
      width: 1.125rem;
      height: 1.125rem;
      display: block;
      flex-shrink: 0;
    }
    .portal-tab.is-active {
      background: var(--iris-slate);
      color: #fff;
      border-color: var(--iris-slate);
      pointer-events: none;
    }
    button.portal-tab {
      cursor: pointer;
      font-family: inherit;
    }
    button.portal-tab-primary {
      background: var(--iris-slate);
      color: #fff;
      border-color: var(--iris-slate);
    }
    button.portal-tab-primary:hover {
      background: var(--iris-dark);
      border-color: var(--iris-dark);
    }
    .auth-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 45vh;
      padding: 2rem 0 3rem;
    }
    .auth-gate-card {
      width: 100%;
      max-width: 360px;
    }
    .auth-gate-card p {
      margin: 0 0 1rem;
      text-align: center;
      color: var(--iris-muted);
      font-size: 0.9rem;
    }
    .auth-gate-form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .auth-gate-form input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--iris-border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      background: #fff;
    }
    .auth-gate-form input:focus {
      outline: 2px solid var(--iris-accent);
      outline-offset: 0;
      border-color: var(--iris-accent);
    }
    .auth-gate-form .btn { width: 100%; margin-top: 0.15rem; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .stat {
      background: #fff;
      border: 1px solid var(--iris-border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .stat .n { font-size: 1.75rem; font-weight: 700; color: var(--iris-slate); }
    .stat .l { font-size: 0.8rem; color: var(--iris-muted); margin-top: 0.2rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius);
      border: 1px solid var(--iris-border);
      background: #fff;
      color: var(--iris-dark);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover { background: var(--iris-surface); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--iris-slate);
      color: #fff;
      border-color: var(--iris-slate);
    }
    .btn-primary:hover { background: var(--iris-dark); border-color: var(--iris-dark); }
    .btn-secondary { background: #fff; }
    .btn-danger-soft {
      background: #fef2f2;
      color: var(--iris-danger);
      border-color: #fecaca;
    }
    .btn-danger-soft:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: var(--iris-danger-hover);
    }
    .btn-danger {
      background: var(--iris-danger);
      color: #fff;
      border-color: var(--iris-danger);
    }
    .btn-danger:hover { background: var(--iris-danger-hover); border-color: var(--iris-danger-hover); }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--iris-muted);
      padding: 0.35rem 0.5rem;
    }
    .btn-ghost:hover { background: var(--iris-surface); color: var(--iris-dark); }
    .btn-icon {
      padding: 0;
      margin: 0;
      border: none;
      background: none;
      color: var(--iris-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      line-height: 1;
    }
    .btn-icon:hover { color: var(--iris-danger); }
    .btn-icon svg { width: 1.125rem; height: 1.125rem; display: block; }
    .btn-sm { padding: 0.3rem 0.55rem; font-size: 0.75rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin: 0;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--iris-border);
      border-radius: var(--radius-lg);
      background: #fff;
      box-shadow: var(--shadow-sm);
    }
    th, td {
      padding: 0.65rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--iris-border);
      vertical-align: middle;
    }
    th {
      background: var(--iris-surface);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--iris-muted);
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tr:hover td { background: #fafbfc; }
    code {
      font-family: ui-monospace, monospace;
      background: var(--iris-surface);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .status-pill {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: lowercase;
    }
    .status-pill.active { background: #dcfce7; color: #166534; }
    .status-pill.inactive { background: #fee2e2; color: #991b1b; }
    .col-toggle {
      width: 2.75rem;
      text-align: center;
      padding: 0.65rem 0.5rem;
      vertical-align: middle;
    }
    .col-log {
      width: 4.5rem;
      text-align: center;
      padding: 0.65rem 0.5rem;
      vertical-align: middle;
    }
    .col-log .btn-log {
      padding: 0.3rem 0.55rem;
      font-size: 0.75rem;
      margin: 0;
      text-decoration: none;
    }
    .col-log .btn-log:hover {
      text-decoration: none;
    }
    .btn-chevron {
      padding: 0.15rem;
      margin: 0;
      border: none;
      background: none;
      color: #94a3b8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      line-height: 1;
    }
    .btn-chevron:hover { color: #64748b; background: var(--iris-surface); }
    .btn-chevron svg {
      width: 0.95rem;
      height: 0.95rem;
      display: block;
      transition: transform 0.2s ease, color 0.15s ease;
    }
    .partner-row.is-expanded .btn-chevron svg { transform: rotate(180deg); }
    tr.partner-detail td {
      padding: 0;
      background: var(--iris-surface);
      border-bottom: 1px solid var(--iris-border);
    }
    tr.partner-detail:last-child td { border-bottom: none; }
    .accordion-panel { padding: 0.85rem 1rem 1rem 1.75rem; }
    .accordion-note { margin-bottom: 0.85rem; }
    .accordion-note label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--iris-muted);
      margin-bottom: 0.35rem;
    }
    .accordion-note textarea {
      width: 100%;
      min-height: 4.5rem;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--iris-border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-family: inherit;
      line-height: 1.45;
      resize: vertical;
      background: #fff;
    }
    .accordion-note textarea:focus {
      outline: 2px solid var(--iris-accent);
      outline-offset: 0;
      border-color: var(--iris-accent);
    }
    .accordion-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }
    .accordion-actions .btn-sm { margin: 0; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal {
      background: #fff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 1.1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--iris-border);
    }
    .modal-header h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    .modal-body {
      padding: 0.25rem 1.25rem 1rem;
      overflow-y: auto;
    }
    .modal-footer {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      padding: 0.85rem 1.25rem 1.1rem;
      border-top: 1px solid var(--iris-border);
      background: var(--iris-surface);
    }
    .field { margin-top: 0.85rem; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--iris-dark);
      margin-bottom: 0.35rem;
    }
    .field input, .field select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--iris-border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      background: #fff;
    }
    .field input:focus, .field select:focus {
      outline: 2px solid var(--iris-accent);
      outline-offset: 0;
      border-color: var(--iris-accent);
    }
    .select-wrap { position: relative; }
    .select-wrap select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 2.25rem;
    }
    .select-chevron {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.1rem;
      height: 1.1rem;
      color: var(--iris-muted);
      pointer-events: none;
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--iris-border);
      border-radius: var(--radius);
      background: var(--iris-surface);
      cursor: pointer;
      user-select: none;
    }
    .checkbox-field input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .checkbox-box {
      width: 1.1rem;
      height: 1.1rem;
      border: 1.5px solid #94a3b8;
      border-radius: 4px;
      background: #fff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .checkbox-field input:checked + .checkbox-box {
      background: var(--iris-slate);
      border-color: var(--iris-slate);
    }
    .checkbox-field input:checked + .checkbox-box svg { opacity: 1; }
    .checkbox-box svg {
      width: 0.75rem;
      height: 0.75rem;
      color: #fff;
      opacity: 0;
    }
    .checkbox-label { font-size: 0.875rem; font-weight: 500; }
    .confirm-modal { max-width: 400px; }
    .confirm-modal .modal-body p {
      margin: 0;
      color: var(--iris-muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .hidden { display: none !important; }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    .msg.err { background: #fef2f2; color: var(--iris-danger); border: 1px solid #fecaca; }
    .msg.ok { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="portal-topbar">
      <div class="portal-brand">
        <img
          src="/partner/symbol-irisid-color-m.png"
          width="36"
          height="36"
          alt=""
        />
        <h1>Partner Admin</h1>
      </div>
      <nav class="portal-nav" aria-label="Partner portal">
        <a href="/partner/signup" class="portal-tab">Partner Sign Up</a>
        <button type="button" class="portal-tab portal-tab-primary hidden" id="btn-add">+ Add partner</button>
        <a href="/partner/settings" class="portal-tab portal-tab-icon" title="Settings" aria-label="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </a>
      </nav>
    </div>

    <div id="banner" class="msg hidden"></div>

    <div id="auth-gate" class="auth-gate">
      <div class="auth-gate-card">
        <p>Enter your admin API key to view and manage partners.</p>
        <div class="auth-gate-form">
          <input type="password" id="admin-key" placeholder="Admin API key" autocomplete="off" />
          <button type="button" class="btn btn-primary" id="btn-unlock">Unlock</button>
        </div>
      </div>
    </div>

    <div id="app" class="hidden">
    <div class="stats" id="stats"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>NO</th>
            <th>Country</th>
            <th>Company</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Code</th>
            <th>Source</th>
            <th>Status</th>
            <th class="col-log">Log</th>
            <th class="col-toggle" aria-label="Expand"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Partner</h2>
      </div>
      <form id="form-partner">
        <div class="modal-body">
          <input type="hidden" id="f-id" />
          <div class="field">
            <label for="f-email">Email *</label>
            <input type="email" id="f-email" required />
          </div>
          <div class="field">
            <label for="f-name">Name *</label>
            <input type="text" id="f-name" required />
          </div>
          <div class="field">
            <label for="f-company">Company *</label>
            <input type="text" id="f-company" required />
          </div>
          <div class="field">
            <label for="f-phone">Phone (optional)</label>
            <input type="tel" id="f-phone" />
          </div>
          <div class="field">
            <label for="f-country">Country *</label>
            <div class="select-wrap">
              <select id="f-country" required></select>
              <svg class="select-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
              </svg>
            </div>
          </div>
          <label class="checkbox-field hidden" id="f-active-wrap">
            <input type="checkbox" id="f-active" checked />
            <span class="checkbox-box" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
              </svg>
            </span>
            <span class="checkbox-label">Active partner account</span>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="confirm-modal">
    <div class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-header">
        <h2 id="confirm-title">Confirm</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    const KEY_STORAGE = "aslan_partner_admin_key";
    const CHEVRON_DOWN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>`;

    let adminKey = sessionStorage.getItem(KEY_STORAGE) || "";
    let countries = [];
    let lastPartners = [];
    let confirmResolve = null;

    function headers() {
      return { "Content-Type": "application/json", "X-Partner-Admin-Key": adminKey };
    }

    function banner(text, err) {
      const b = document.getElementById("banner");
      b.textContent = text;
      b.className = "msg " + (err ? "err" : "ok");
      b.classList.remove("hidden");
      if (!err) setTimeout(() => b.classList.add("hidden"), 4000);
    }

    async function loadCountries() {
      const r = await fetch(API + "/api/partner/countries");
      const data = await r.json();
      countries = data.countries || [];
      const sel = document.getElementById("f-country");
      sel.innerHTML = countries.map((c) => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("");
      const def = data.default_country || "United States";
      if ([...sel.options].some((o) => o.value === def)) sel.value = def;
    }

    function confirmDialog({ title, message, confirmLabel = "Confirm", danger = false }) {
      return new Promise((resolve) => {
        confirmResolve = resolve;
        document.getElementById("confirm-title").textContent = title;
        document.getElementById("confirm-message").textContent = message;
        const ok = document.getElementById("confirm-ok");
        ok.textContent = confirmLabel;
        ok.className = "btn " + (danger ? "btn-danger" : "btn-primary");
        document.getElementById("confirm-modal").classList.remove("hidden");
      });
    }

    function closeConfirm(result) {
      document.getElementById("confirm-modal").classList.add("hidden");
      if (confirmResolve) {
        const fn = confirmResolve;
        confirmResolve = null;
        fn(result);
      }
    }

    document.getElementById("confirm-cancel").addEventListener("click", () => closeConfirm(false));
    document.getElementById("confirm-ok").addEventListener("click", () => closeConfirm(true));

    function formatApiError(data, statusText) {
      if (data.detail && typeof data.detail === "object" && !Array.isArray(data.detail)) {
        return data.detail.message || JSON.stringify(data.detail);
      }
      if (typeof data.detail === "string") return data.detail;
      if (Array.isArray(data.detail)) {
        return data.detail.map((d) => d.msg || JSON.stringify(d)).join("; ");
      }
      return statusText;
    }

    async function api(path, opts = {}) {
      const method = (opts.method || "GET").toUpperCase();
      let url = API + path;
      if (method === "GET") {
        const sep = path.includes("?") ? "&" : "?";
        url += sep + "_=" + Date.now();
      }
      const r = await fetch(url, { ...opts, headers: { ...headers(), ...(opts.headers || {}) }, cache: "no-store" });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const err = new Error(formatApiError(data, r.statusText));
        err.status = r.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function partnerCountry(p) {
      if (p.country) return p.country;
      const byIso = countries.find((c) => c.iso === p.country_iso);
      if (byIso) return byIso.name;
      return p.country_iso || "—";
    }

    function renderStats(s) {
      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="n">${s.active_partners}</div><div class="l">Active</div></div>
        <div class="stat"><div class="n">${Math.max(0, (s.total_partners_ever || 0) - (s.active_partners || 0))}</div><div class="l">Inactive</div></div>
        <div class="stat"><div class="n">${s.total_partners_ever}</div><div class="l">Total</div></div>
        <div class="stat"><div class="n">${s.signups}</div><div class="l">Self sign-ups</div></div>
        <div class="stat"><div class="n">${s.admin_created}</div><div class="l">Admin created</div></div>
      `;
    }

    function renderTable(partners) {
      lastPartners = partners.slice();
      const tb = document.getElementById("tbody");
      const expandedIds = [...document.querySelectorAll("tr.partner-detail:not(.hidden)")].map(
        (tr) => tr.dataset.detailFor
      );
      if (!partners.length) {
        tb.innerHTML = '<tr><td colspan="11">No partners found</td></tr>';
        return;
      }
      tb.innerHTML = partners.map((p, i) => {
        const active = partnerIsActive(p);
        const status = active ? "active" : "inactive";
        const noteVal = p.note || "";
        return `
        <tr class="partner-row" data-id="${p.id}">
          <td>${i + 1}</td>
          <td>${esc(partnerCountry(p))}</td>
          <td>${esc(p.company)}</td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.email)}</td>
          <td>${esc(p.phone || "—")}</td>
          <td><code>${esc(p.code)}</code></td>
          <td>${p.source}</td>
          <td><span class="status-pill ${status}">${status}</span></td>
          <td class="col-log">
            <a href="/partner/log?id=${p.id}" class="btn btn-sm btn-secondary btn-log">Log</a>
          </td>
          <td class="col-toggle">
            <button type="button" class="btn-chevron" data-toggle="${p.id}" aria-expanded="false" aria-label="Show actions for ${esc(p.name)}">${CHEVRON_DOWN_SVG}</button>
          </td>
        </tr>
        <tr class="partner-detail hidden" data-detail-for="${p.id}">
          <td colspan="11">
            <div class="accordion-panel">
              <div class="accordion-note">
                <label for="note-${p.id}">Note</label>
                <textarea id="note-${p.id}" data-note="${p.id}" data-saved="${esc(noteVal)}" placeholder="Internal memo…">${esc(noteVal)}</textarea>
              </div>
              <div class="accordion-actions">
                <button type="button" class="btn btn-sm btn-secondary" data-edit="${p.id}">Edit</button>
                <button type="button" class="btn btn-sm btn-secondary" data-regen="${p.id}">New code</button>
                ${active
                  ? `<button type="button" class="btn btn-sm btn-secondary" data-del="${p.id}">Deactivate</button>`
                  : `<button type="button" class="btn btn-sm btn-secondary" data-reactivate="${p.id}">Reactivate</button>`}
                <button type="button" class="btn btn-sm btn-danger-soft" data-delete="${p.id}">Delete</button>
              </div>
            </div>
          </td>
        </tr>
      `;
      }).join("");
      for (const id of expandedIds) {
        const detail = tb.querySelector(`tr.partner-detail[data-detail-for="${id}"]`);
        const row = tb.querySelector(`tr.partner-row[data-id="${id}"]`);
        const btn = tb.querySelector(`[data-toggle="${id}"]`);
        if (!detail) continue;
        detail.classList.remove("hidden");
        row?.classList.add("is-expanded");
        btn?.setAttribute("aria-expanded", "true");
      }
    }

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
    }

    function partnerIsActive(p) {
      return p && (p.active === true || p.active === 1);
    }

    async function refresh() {
      const data = await api("/api/partner/admin/dashboard", {
        method: "POST",
        body: JSON.stringify({ include_inactive: true }),
      });
      renderStats(data.stats || {});
      renderTable(data.partners || []);
    }

    function openModal(mode, partner) {
      document.getElementById("modal-title").textContent = mode === "add" ? "Add partner" : "Edit partner";
      document.getElementById("f-id").value = partner?.id || "";
      document.getElementById("f-email").value = partner?.email || "";
      document.getElementById("f-name").value = partner?.name || "";
      document.getElementById("f-company").value = partner?.company || "";
      document.getElementById("f-phone").value = partner?.phone || "";
      const countrySel = document.getElementById("f-country");
      const countryVal = partner?.country || partner?.country_iso || "United States";
      if ([...countrySel.options].some((o) => o.value === countryVal)) {
        countrySel.value = countryVal;
      } else if (partner?.country_iso) {
        const byIso = countries.find((c) => c.iso === partner.country_iso);
        if (byIso) countrySel.value = byIso.name;
      }
      document.getElementById("f-active-wrap").classList.toggle("hidden", mode === "add");
      document.getElementById("f-active").checked = partner ? partnerIsActive(partner) : true;
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      document.getElementById("f-id").value = "";
    }

    document.getElementById("btn-unlock").addEventListener("click", async () => {
      adminKey = document.getElementById("admin-key").value.trim();
      if (!adminKey) return;
      try {
        await api("/api/partner/admin/dashboard", {
          method: "POST",
          body: JSON.stringify({ include_inactive: true }),
        });
        sessionStorage.setItem(KEY_STORAGE, adminKey);
        document.getElementById("auth-gate").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        document.getElementById("btn-add").classList.remove("hidden");
        await loadCountries();
        await refresh();
      } catch (e) {
        banner(e.message || "Invalid key", true);
      }
    });

    if (adminKey) {
      document.getElementById("admin-key").value = adminKey;
      document.getElementById("btn-unlock").click();
    }

    document.getElementById("btn-add").addEventListener("click", () => openModal("add"));
    document.getElementById("btn-cancel").addEventListener("click", closeModal);
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });
    document.getElementById("confirm-modal").addEventListener("click", (e) => {
      if (e.target.id === "confirm-modal") closeConfirm(false);
    });

    document.getElementById("form-partner").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("f-id").value;
      const body = {
        email: document.getElementById("f-email").value.trim(),
        name: document.getElementById("f-name").value.trim(),
        company: document.getElementById("f-company").value.trim(),
        phone: document.getElementById("f-phone").value.trim() || null,
        country: document.getElementById("f-country").value,
      };
      try {
        let msg = "Saved";
        if (id) {
          body.active = document.getElementById("f-active").checked;
          const res = await api("/api/partner/admin/partners/" + id + "/update", {
            method: "POST",
            body: JSON.stringify(body),
          });
          if (!res.partner) throw new Error("Update failed — server returned no partner record");
          if (body.active && !partnerIsActive(res.partner)) {
            const act = await api("/api/partner/admin/partners/" + id + "/activate", { method: "POST" });
            if (act.partner) res.partner = act.partner;
          }
          msg = `Updated: ${res.partner.email} (${partnerIsActive(res.partner) ? "active" : "inactive"})`;
        } else {
          body.send_email = true;
          const res = await api("/api/partner/admin/partners", { method: "POST", body: JSON.stringify(body) });
          if (res.partner) {
            msg = `Added: ${res.partner.name} <${res.partner.email}> — code ${res.partner.code}`;
            if (res.email_warning) msg += ` (email warning: ${res.email_warning})`;
          }
        }
        closeModal();
        await refresh();
        banner(msg, false);
      } catch (err) {
        if (err.status === 409 && err.data?.detail?.partner) {
          await refresh();
          openModal("edit", err.data.detail.partner);
          banner((err.data.detail.message || err.message) + " — opened existing partner.", true);
          return;
        }
        banner(err.message, true);
      }
    });

    document.getElementById("tbody").addEventListener("click", async (e) => {
      const toggleBtn = e.target.closest("[data-toggle]");
      if (toggleBtn) {
        const id = toggleBtn.dataset.toggle;
        const detail = document.querySelector(`tr.partner-detail[data-detail-for="${id}"]`);
        const row = document.querySelector(`tr.partner-row[data-id="${id}"]`);
        if (!detail) return;
        const opening = detail.classList.contains("hidden");
        detail.classList.toggle("hidden", !opening);
        toggleBtn.setAttribute("aria-expanded", String(opening));
        row?.classList.toggle("is-expanded", opening);
        return;
      }

      const delBtn = e.target.closest("[data-delete]");
      const btn = e.target.closest("button");
      if (!btn) return;

      if (delBtn) {
        const id = delBtn.dataset.delete;
        const p = lastPartners.find((x) => String(x.id) === id);
        const name = p ? `${p.name} (${p.email})` : `ID ${id}`;
        const ok = await confirmDialog({
          title: "Delete partner?",
          message: `Permanently delete ${name}? This cannot be undone and their access code will stop working.`,
          confirmLabel: "Delete",
          danger: true,
        });
        if (!ok) return;
        try {
          await api("/api/partner/admin/partners/" + id + "/delete", { method: "POST" });
          await refresh();
          banner("Partner deleted", false);
        } catch (err) {
          banner(err.message, true);
        }
        return;
      }

      const id = btn.dataset.edit || btn.dataset.regen || btn.dataset.del || btn.dataset.reactivate;
      if (!id) return;
      try {
        if (btn.dataset.edit) {
          let p = lastPartners.find((x) => String(x.id) === id);
          if (!p) {
            await refresh();
            p = lastPartners.find((x) => String(x.id) === id);
          }
          if (p) openModal("edit", p);
        } else if (btn.dataset.regen) {
          const ok = await confirmDialog({
            title: "Generate new code?",
            message: "A new access code will be created and emailed to the partner.",
            confirmLabel: "Send new code",
          });
          if (!ok) return;
          await api("/api/partner/admin/partners/" + id + "/regenerate-code?send_email=true", { method: "POST" });
          await refresh();
          banner("New code sent", false);
        } else if (btn.dataset.reactivate) {
          await api("/api/partner/admin/partners/" + id + "/activate", { method: "POST" });
          await refresh();
          banner("Partner reactivated", false);
        } else if (btn.dataset.del) {
          const ok = await confirmDialog({
            title: "Deactivate partner?",
            message: "Their access code will stop working until reactivated.",
            confirmLabel: "Deactivate",
            danger: true,
          });
          if (!ok) return;
          await api("/api/partner/admin/partners/" + id + "/deactivate", { method: "POST" });
          await refresh();
          banner("Partner deactivated", false);
        }
      } catch (err) {
        banner(err.message, true);
      }
    });

    document.getElementById("tbody").addEventListener(
      "blur",
      async (e) => {
        const ta = e.target.closest("[data-note]");
        if (!ta || !ta.matches("textarea")) return;
        const id = ta.dataset.note;
        const saved = ta.dataset.saved || "";
        const value = ta.value;
        if (value === saved) return;
        try {
          await api("/api/partner/admin/partners/" + id + "/update", {
            method: "POST",
            body: JSON.stringify({ note: value.trim() || null }),
          });
          ta.dataset.saved = value;
          const p = lastPartners.find((x) => String(x.id) === String(id));
          if (p) p.note = value.trim() || null;
        } catch (err) {
          banner(err.message || "Failed to save note", true);
        }
      },
      true
    );
  </script>
</body>
</html>
